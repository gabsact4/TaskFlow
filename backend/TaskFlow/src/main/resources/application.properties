spring.application.name=TaskFlow

# ---------------------------------------------------------------------------
# Datasource (MySQL) — sobrescreva via variaveis de ambiente em producao
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskflow}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# ddl-auto=validate: o schema e controlado exclusivamente pelo Flyway.
# O Hibernate apenas confere se as entidades batem com o schema aplicado.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Uploads são limitados pelo produto a 20 MB por arquivo.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
taskflow.attachments.directory=${TASKFLOW_ATTACHMENTS_DIRECTORY:./taskflow-data/attachments}

# ---------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
taskflow.flyway.repair-known-checksums=${TASKFLOW_FLYWAY_REPAIR_KNOWN_CHECKSUMS:false}

# ---------------------------------------------------------------------------
# JWT
# ---------------------------------------------------------------------------
# Obrigatorio para assinar/verificar tokens: forneca uma chave aleatoria de
# pelo menos 256 bits via variavel de ambiente ou secret manager.
security.jwt.secret=${JWT_SECRET:}
# Tempo de expiracao do token em milissegundos (padrao: 1 hora)
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Chave AES-256 em Base64 para criptografia e índice HMAC dos e-mails.
# Gere com: openssl rand -base64 32. Mantenha-a fora do repositório.

# WebAuthn/passkeys: substitua pelos domínios e origens reais do cliente.
security.webauthn.rp-id=${WEBAUTHN_RP_ID:localhost}
security.webauthn.rp-name=${WEBAUTHN_RP_NAME:TaskFlow}
security.webauthn.origins=${WEBAUTHN_ORIGINS:http://localhost:3000}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:19006}
