services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: taskflow
      MYSQL_USER: taskflow
      MYSQL_PASSWORD: ${DB_PASSWORD:-taskflow_dev_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-taskflow_root_dev_password}
    ports:
      - "3307:3306"
    volumes:
      - taskflow-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./backend/TaskFlow
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:mysql://db:3306/taskflow
      DB_USERNAME: taskflow
      DB_PASSWORD: ${DB_PASSWORD:-taskflow_dev_password}
      TASKFLOW_FLYWAY_REPAIR_KNOWN_CHECKSUMS: ${TASKFLOW_FLYWAY_REPAIR_KNOWN_CHECKSUMS:-true}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-jwt-secret-before-deployment}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-TaskFlow}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-http://localhost:3000,http://localhost:8081,http://localhost:19006}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8081,http://localhost:19006}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  taskflow-mysql-data: